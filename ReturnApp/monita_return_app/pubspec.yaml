name: monita_return_app
description: モニ太返却箱専用Androidアプリ
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter_bluetooth_serial_plus: ^0.5.6
  flutter:
    sdk: flutter

  # QRコードをカメラで読み取る
  mobile_scanner: ^7.0.1

  # Raspberry Piの返却サーバーと通信する
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true